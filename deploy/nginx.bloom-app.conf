server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → kactus-fin over the compose network. Same-origin for the browser,
    # so session cookies need no CORS/SameSite=None story and the bundle needs
    # no VITE_API_BASE_URL. `^~` is required: regex locations (the static-asset
    # block below) outrank plain prefixes, so without it /api/foo.js would be
    # served from disk as a 404.
    location ^~ /api/ {
        proxy_pass http://kactus-fin:17600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE (text/event-stream). With buffering on, events sit in nginx until the
    # buffer fills; the long read timeout keeps idle streams alive.
    location = /api/portfolios/stream {
        proxy_pass http://kactus-fin:17600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
    }

    # WebSocket upgrade (mirrors the vite dev proxy's /ws)
    location ^~ /ws {
        proxy_pass http://kactus-fin:17600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kactus" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  kactus-fin:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin
    env_file: .env
    environment:
      # Service names resolve inside the compose network only; the Pydantic
      # default stays localhost per .claude/rules/docker-conventions.md.
      KACTUS_REDIS_URL: redis://redis:6379/0
      # dev runs one process, so `memory` would work — `redis` is set for parity,
      # so a Redis-only bug (a key that never expires, an unencrypted payload)
      # shows up here rather than first appearing in staging.
      KACTUS_COORDINATION_BACKEND: redis
    ports:
      - "17600:17600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../libs/core/kactus-common/src:/app/libs/core/kactus-common/src
      - ../../libs/kactus-data/src:/app/libs/kactus-data/src
      - ../../libs/kactus-notification/src:/app/libs/kactus-notification/src
      - ../../services/kactus-fin/src:/app/services/kactus-fin/src
    command: >
      uvicorn kactus_fin.app:app --host 0.0.0.0 --port 17600 --reload --log-level debug

  kactus-fin-gw:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin-gw
    env_file: .env
    ports:
      - "17601:17601"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../libs/core/kactus-common/src:/app/libs/core/kactus-common/src
      - ../../services/kactus-fin-gateway/src:/app/services/kactus-fin-gateway/src
    command: >
      uvicorn kactus_fin_gateway.app:app --host 0.0.0.0 --port 17601 --reload --log-level debug

volumes:
  postgres_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kactus" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kactus-fin:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin
    restart: unless-stopped
    env_file: .env
    ports:
      - "17600:17600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SINGLE WORKER — load-bearing, do not raise. kactus-fin holds three pieces of
    # in-process state: the portfolio APScheduler (N workers ⇒ N duplicate crawls +
    # DuckDB write-lock contention), the SSE broker (a client only hears from the
    # worker it landed on), and the Zalo PA QR-login session store (the 5-step flow
    # breaks when steps round-robin across workers). Scale-out needs Redis pub/sub
    # + a shared session store first. kactus-fin-gw below is stateless — it keeps 2.
    command: >
      uvicorn kactus_fin.app:app --host 0.0.0.0 --port 17600 --workers 1 --log-level info

  kactus-fin-gw:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin-gw
    restart: unless-stopped
    env_file: .env
    ports:
      - "17601:17601"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn kactus_fin_gateway.app:app --host 0.0.0.0 --port 17601 --workers 2 --log-level info

volumes:
  postgres_data:
  redis_data:

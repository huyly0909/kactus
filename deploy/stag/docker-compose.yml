services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kactus" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kactus-fin:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin
    restart: unless-stopped
    env_file: .env
    environment:
      # Service names resolve inside the compose network only; the Pydantic
      # default stays localhost per .claude/rules/docker-conventions.md.
      KACTUS_REDIS_URL: redis://redis:6379/0
      # Shared SSE broker + shared Zalo QR session store. Set here rather than in
      # .env so it cannot drift out of sync with the redis service above.
      KACTUS_COORDINATION_BACKEND: redis
      KACTUS_DATA_PLANE_URL: http://kactus-data-server:17602
    ports:
      - "17600:17600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Multi-worker again, and now safe. All three reasons it had to be 1 are
    # gone: KACTUS_COORDINATION_BACKEND=redis shares the SSE broker and the Zalo
    # PA QR session store across processes, and the scheduler + DuckDB write
    # handle have moved into kactus-data-server, which runs a single replica.
    command: >
      uvicorn kactus_fin.app:app --host 0.0.0.0 --port 17600 --workers 2 --log-level info

  # The data plane — not published, same as prod. Staging shares the vnstock
  # rate-limit budget with prod if it points at the same key, so consider
  # KACTUS_ENABLE_PORTFOLIO_SCHEDULER=false here to keep it from competing.
  kactus-data-server:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.data-server
    restart: unless-stopped
    env_file: .env
    environment:
      KACTUS_REDIS_URL: redis://redis:6379/0
      KACTUS_COORDINATION_BACKEND: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - duckdb_data:/data
    # ONE WORKER AND ONE REPLICA — load-bearing, do not raise either. Only this
    # process may hold the DuckDB write handle, and only one copy of the crawl
    # scheduler may run. See the prod compose for the full reasoning.
    deploy:
      replicas: 1
    command: >
      uvicorn kactus_data_server.app:app --host 0.0.0.0 --port 17602 --workers 1 --log-level info

  # Frontend SPA (nginx) + same-origin /api reverse proxy to kactus-fin.
  # The bundle is built without VITE_API_BASE_URL — the browser only ever
  # talks to this origin.
  bloom-app:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.bloom-app
    restart: unless-stopped
    ports:
      - "17630:80"
    # Startup ordering only — nginx proxies per request.
    depends_on:
      - kactus-fin

  kactus-fin-gw:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin-gw
    restart: unless-stopped
    env_file: .env
    ports:
      - "17601:17601"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn kactus_fin_gateway.app:app --host 0.0.0.0 --port 17601 --workers 2 --log-level info

volumes:
  postgres_data:
  redis_data:
  # Mounted by kactus-data-server ONLY — see the worker note on that service.
  duckdb_data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kactus" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  kactus-fin:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin
    restart: unless-stopped
    env_file: .env
    environment:
      # Service names resolve inside the compose network only; the Pydantic
      # default stays localhost per .claude/rules/docker-conventions.md.
      KACTUS_REDIS_URL: redis://redis:6379/0
      # Shared SSE broker + shared Zalo QR session store. Set here rather than in
      # .env so it cannot drift out of sync with the redis service above.
      KACTUS_COORDINATION_BACKEND: redis
    ports:
      - "17600:17600"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # SINGLE WORKER — load-bearing, do not raise. Two of the three reasons are now
    # gone: with KACTUS_COORDINATION_BACKEND=redis the SSE broker and the Zalo PA
    # QR session store are both shared across processes. What remains is the
    # portfolio APScheduler, which is still in-process — N workers would mean N
    # schedulers, so N duplicate crawls and DuckDB write-lock contention. Raising
    # this needs the scheduler to move into its own single-replica data-plane
    # service. kactus-fin-gw below is stateless — it keeps 2.
    command: >
      uvicorn kactus_fin.app:app --host 0.0.0.0 --port 17600 --workers 1 --log-level info

  kactus-fin-gw:
    build:
      context: ../../
      dockerfile: deploy/Dockerfile.fin-gw
    restart: unless-stopped
    env_file: .env
    ports:
      - "17601:17601"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      uvicorn kactus_fin_gateway.app:app --host 0.0.0.0 --port 17601 --workers 2 --log-level info

volumes:
  postgres_data:
  redis_data:

[project]
name = "kactus"
version = "0.1.0"
description = "Kactus monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=7.0.0",
]

[tool.uv.workspace]
# Layered layout: services/ are deployable, libs/ are imported downward only.
# `deploy/` no longer needs an exclude — it sits outside the member globs.
members = ["services/*", "libs/*", "libs/core/*"]
# `libs/core` is a grouping directory, not a package — `libs/*` would match it.
exclude = ["libs/core"]

[tool.uv.sources]
kactus-common = { workspace = true }
kactus-data = { workspace = true }
kactus-notification = { workspace = true }
kactus-fin = { workspace = true }
kactus-fin-gateway = { workspace = true }

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest-asyncio>=0.26.0",
    "httpx>=0.28.0",
    "pytest-cov>=7.0.0",
    "import-linter>=2.13",
    "fakeredis[lua]>=2.37.0",
]

# pytest config is in pytest.ini (single source of truth)

# ---------------------------------------------------------------------------
# Layer enforcement — `uv run lint-imports` (also a pre-commit hook).
#
# The directory layout (services/ over libs/ over libs/core/) makes the layering
# visible; Python import does not care about directory depth, so this contract is
# what actually enforces it. Encodes the CLAUDE.md rule "never import from app
# packages into kactus-common", plus the one-way flow between the two libs.
# ---------------------------------------------------------------------------

[tool.importlinter]
root_packages = [
    "kactus_common",
    "kactus_data",
    "kactus_notification",
    "kactus_fin",
    "kactus_fin_gateway",
]

[[tool.importlinter.contracts]]
name = "Kactus layers: services -> libs -> core"
type = "layers"
layers = [
    "kactus_fin | kactus_fin_gateway",
    # Sibling libs: neither may import the other. kactus-data must not learn to
    # send notifications, and kactus-notification must not learn to crawl.
    "kactus_data | kactus_notification",
    "kactus_common",
]

# ---------------------------------------------------------------------------
# Coverage gate — invoked explicitly by CI as
#   uv run pytest --cov --cov-fail-under=80
# Local dev keeps `uv run pytest` fast (no coverage measurement). The 80%
# threshold is the target; adjust --cov-fail-under as coverage improves.
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = false
source = [
    "libs/core/kactus-common/src/kactus_common",
    "libs/kactus-data/src/kactus_data",
    "libs/kactus-notification/src/kactus_notification",
    "services/kactus-fin/src/kactus_fin",
    "services/kactus-fin-gateway/src/kactus_fin_gateway",
]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__main__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "\\.\\.\\.",
]

[pytest]
asyncio_mode = auto
testpaths =
    libs/core/kactus-common/tests
    libs/domain/kactus-gold/tests
    libs/domain/kactus-stock-vn/tests
    libs/kactus-data/tests
    libs/kactus-notification/tests
    services/kactus-fin/tests
    services/kactus-fin-gateway/tests
    services/kactus-data-plane/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --import-mode=importlib
    --tb=short
    --strict-markers
filterwarnings =
    error
    ignore::DeprecationWarning:tarfile
    ignore::ResourceWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (requires Docker)
    unit: marks tests as unit tests
[project]
name = "kactus-data"
version = "0.1.0"
description = "Data scraping, collection, and ETL pipelines"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "curl-cffi>=0.15.0",
    "kactus-common",
    "kactus-gold",
    "kactus-stock-vn",
    # Indicator/percentile maths in market/analytics.py. Arrives transitively
    # with pandas, but declared because we import it directly.
    "numpy>=1.26",
    "pandas>=2.2,<3",
    "pytz>=2026.2",
    "requests>=2.32.5",
    "typer>=0.24.1",
    "vnstock>=4.0.4",
]

[tool.uv.sources]
kactus-common = { workspace = true }
kactus-gold = { workspace = true }
kactus-stock-vn = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kactus_data"]

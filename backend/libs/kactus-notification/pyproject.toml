[project]
name = "kactus-notification"
version = "0.1.0"
description = "Multi-channel notification domain: channels, templates, dispatch, delivery audit"
requires-python = ">=3.12"
dependencies = [
    "kactus-common",
    "pydantic>=2.12.5",
    "sqlalchemy[asyncio]>=2.0.0",
    "loguru>=0.7.0",
    # Telegram / Slack HTTP delivery
    "requests>=2.32.5",
    # Zalo PA — unofficial personal-account client. Deliberately confined to this
    # package: `zlapi` is reverse-engineered and pulls its own crypto/websocket
    # stack, which every kactus-common consumer used to inherit (the gateway
    # included, and it never sends a notification).
    "zlapi>=1.0.3",
    "curl-cffi>=0.15.0",
    "pycryptodome>=3.23.0",
    "websocket-client>=1.9.0",
]

[tool.uv.sources]
kactus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kactus_notification"]

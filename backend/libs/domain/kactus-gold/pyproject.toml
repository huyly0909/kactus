[project]
name = "kactus-gold"
version = "0.1.0"
description = "Gold domain: availability schedules, sync-job contracts, market read schemas"
requires-python = ">=3.12"
dependencies = [
    "kactus-common",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
kactus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kactus_gold"]

[project]
name = "kactus-stock-vn"
version = "0.1.0"
description = "Vietnam stock-market domain: report/interval enums, market read schemas"
requires-python = ">=3.12"
dependencies = [
    "kactus-common",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
kactus-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kactus_stock_vn"]
